name: CI Aula 08 - TechNova API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-aula08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Verificar ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-08/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Executar Jest com Coverage
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-08/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Construir imagem Docker
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-08/technova-api
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secrets AWS e banco de dados
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for nome in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DB_PASSWORD; do
            if [ -n "${!nome}" ]; then
              echo "Secret $nome configurado"
            else
              echo "Secret $nome não configurado"
              exit 1
            fi
          done
      - name: Docker build
        run: docker build -t technova-aula08:${{ github.sha }} .
