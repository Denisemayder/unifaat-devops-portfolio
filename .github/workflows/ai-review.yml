name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar o diff do Pull Request
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr-diff.txt

      - name: Executar revisão automática
        id: review
        continue-on-error: true
        run: node .github/scripts/ai-review.js
        env:
          DIFF_FILE: /tmp/pr-diff.txt

      - name: Publicar comentário no Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('/tmp/ai-review-report.md')
              ? fs.readFileSync('/tmp/ai-review-report.md', 'utf8')
              : 'Não foi possível gerar o relatório da revisão.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

      - name: Quality Gate
        if: always()
        run: |
          if [ "${{ steps.review.outcome }}" != "success" ]; then
            echo "Quality Gate reprovado."
            exit 1
          fi
          echo "Quality Gate aprovado."
