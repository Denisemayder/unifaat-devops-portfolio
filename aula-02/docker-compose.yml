# Ambiente TechNova — API + PostgreSQL + Redis
# Aula 02 — Docker Compose

services:
  # Serviço da API Node.js
  api:
    build: .
    container_name: technova-api
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - technova-network

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: technova-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - technova-network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: technova-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - technova-network

# Volume nomeado para persistência do PostgreSQL
volumes:
  postgres-data:

# Rede customizada
networks:
  technova-network:
    driver: bridge
